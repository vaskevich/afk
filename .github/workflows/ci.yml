# Continuous integration: typecheck, lint, format, test, and build the monorepo,
# a macOS job for the bash client's tests, plus a separate job that validates the
# OpenTofu config in infra/. Runs on every
# pull request, and is called as a reusable workflow (`workflow_call`) by deploy.yml
# on pushes to main so a deployment is gated on these same jobs. It deliberately has
# no `push` trigger of its own: a standalone run on main would share this concurrency
# group with the nested call and one would cancel the other.
name: CI

on:
  pull_request:
  workflow_call: {}

# One in-progress run per ref at a time -- a new push cancels whatever CI run was
# still going for the same ref instead of queuing behind it.
# The default token needs nothing more than reading the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      # Every third-party action here and in deploy.yml is pinned to a full commit
      # SHA rather than a tag: a tag can be moved to different code, a commit cannot.
      # The trailing comment is the release that SHA corresponds to; Dependabot
      # (.github/dependabot.yml) bumps both together.
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No version pinned here: this reads the `packageManager` field in
      # package.json (currently pnpm@10.13.1) itself, so the pnpm version only
      # has to change in one place -- same idea as the Dockerfile's pnpm pin.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Must come after pnpm/action-setup: `cache: pnpm` shells out to
      # `pnpm store path` to find what to cache, which needs pnpm on PATH already.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies only (what ships in the image), high and critical
      # advisories only, so a dev-only or low-severity advisory does not block a
      # merge. Clean as of 2026-09-14.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The bash client is not covered by ESLint. `pnpm lint:sh` skips when shellcheck
      # is missing, so it is installed first to make sure the check actually runs here.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck the client
        run: pnpm lint:sh

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # `pnpm build` compiles @afk/shared and @afk/server with tsc (a type error fails
      # here as well as in the typecheck step) and builds the dashboard.
      - name: Build
        run: pnpm build

      # The image's entrypoint, exercised on Linux: the same command as the
      # Dockerfile's CMD, from the same layout (the repo root stands in for /app),
      # with no tsx or TypeScript source involved. Catches a compiled server that
      # cannot start, which the typecheck cannot -- a missing runtime dependency, a
      # broken import rewrite, or the `afk-compiled` exports condition falling out
      # of step with packages/shared/dist.
      - name: Smoke-test the compiled server
        run: |
          AFK_STORAGE=disk AFK_DATA_DIR="$(mktemp -d)" AFK_PORT=4141 \
            node --conditions=afk-compiled packages/server/dist/index.js &
          server_pid=$!
          for _ in $(seq 1 50); do
            if health="$(curl -fsS http://localhost:4141/api/health 2>/dev/null)"; then
              echo "GET /api/health: ${health}"
              echo "GET /versionz:   $(curl -fsS http://localhost:4141/versionz)"
              kill "${server_pid}"
              wait "${server_pid}"
              exit 0
            fi
            sleep 0.2
          done
          echo "error: the compiled server did not answer /api/health within 10 s" >&2
          kill "${server_pid}" || true
          exit 1

  # The bash client's collectors and the end-to-end contract test only run on macOS
  # (every such test is `skipIf(platform !== "darwin")`), so on the Ubuntu job above a
  # cli/afk change gets nothing but shellcheck. This job runs the client's unit tests
  # and the contract test on a Mac runner. macOS minutes are free on public repos and
  # billed at 10x on private ones, so this is the one job kept to what needs a Mac.
  # deploy.yml gates on ci.yml as a whole (`uses: ./.github/workflows/ci.yml`), which
  # means it waits for this job too without being told about it.
  client-macos:
    name: Client tests on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client unit tests
        run: pnpm vitest run cli

      - name: Contract test
        run: pnpm test:contract

  infra:
    name: OpenTofu fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8

      - name: tofu fmt -check
        run: tofu -chdir=infra fmt -check

      # No AWS credentials and no state backend here: this only checks that the
      # config is syntactically valid and internally consistent (variable
      # references resolve, resource arguments type-check), not that it matches
      # what's actually deployed.
      - name: tofu init (no backend)
        run: tofu -chdir=infra init -backend=false

      - name: tofu validate
        run: tofu -chdir=infra validate
